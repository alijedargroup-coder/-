<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مجمع OCR - خدمة العملاء</title>
<style>
  body { margin: 0; background: #060d15; display: flex; justify-content: center; padding: 24px 12px; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
</style>
</head>
<body>

<div dir="rtl" style="width: 100%; max-width: 480px; margin: 0 auto; background: #0b1620; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.35);">

  <div style="background: #0f2436; padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #1c3549;">
    <div style="width: 42px; height: 42px; border-radius: 50%; background: #1c3549; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #d8b06b; font-size: 15px;">OCR</div>
    <div>
      <div style="color: #f2e9d8; font-weight: 600; font-size: 15px;">مجمع OCR السكني</div>
      <div style="color: #9fb3c2; font-size: 12px;">خدمة العملاء — مجموعة الجدار</div>
    </div>
    <div style="margin-right: auto; display: flex; align-items: center; gap: 6px;">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #4caf7d; display: inline-block;"></span>
      <span style="color: #9fb3c2; font-size: 12px;">متصل الآن</span>
    </div>
  </div>

  <div id="messages" style="height: 420px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #0b1620;"></div>

  <div id="typing-row" style="display: none; padding: 0 16px 8px; background: #0b1620;">
    <div style="display: inline-flex; gap: 4px; background: #16283a; padding: 10px 14px; border-radius: 14px 14px 14px 2px;">
      <span style="width:6px;height:6px;border-radius:50%;background:#9fb3c2;animation:blink 1.2s infinite;"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:#9fb3c2;animation:blink 1.2s infinite 0.2s;"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:#9fb3c2;animation:blink 1.2s infinite 0.4s;"></span>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 12px 16px; background: #0f2436; border-top: 1px solid #1c3549;">
    <input id="input" type="text" placeholder="اكتب رسالتك هنا..." style="flex: 1; background: #16283a; border: 1px solid #1c3549; color: #f2e9d8; border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none;" />
    <button id="send" style="background: #d8b06b; color: #0b1620; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer;">إرسال</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const typingRow = document.getElementById('typing-row');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

function addBubble(text, from) {
  const row = document.createElement('div');
  row.style.display = 'flex';
  row.style.justifyContent = from === 'user' ? 'flex-start' : 'flex-end';
  const bubble = document.createElement('div');
  bubble.style.maxWidth = '78%';
  bubble.style.padding = '10px 14px';
  bubble.style.borderRadius = from === 'user' ? '14px 14px 2px 14px' : '14px 14px 14px 2px';
  bubble.style.background = from === 'user' ? '#1c3549' : '#16283a';
  bubble.style.color = '#f2e9d8';
  bubble.style.fontSize = '14px';
  bubble.style.lineHeight = '1.6';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function getBotReply() {
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await response.json();
    return data.reply || "عذراً، ممكن توضح أكثر؟";
  } catch (e) {
    return "عذراً، صار خلل بسيط بالاتصال. ممكن تعيد رسالتك؟";
  }
}

async function sendMessage(text) {
  addBubble(text, 'user');
  history.push({ role: 'user', content: text });
  input.value = '';
  input.disabled = true;
  sendBtn.disabled = true;

  typingRow.style.display = 'block';
  messagesEl.scrollTop = messagesEl.scrollHeight;

  const delay = 1400 + Math.random() * 1800;
  const [reply] = await Promise.all([
    getBotReply(),
    new Promise((res) => setTimeout(res, delay)),
  ]);

  typingRow.style.display = 'none';
  addBubble(reply, 'bot');
  history.push({ role: 'assistant', content: reply });
  input.disabled = false;
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', () => {
  const text = input.value.trim();
  if (text) sendMessage(text);
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const text = input.value.trim();
    if (text) sendMessage(text);
  }
});

typingRow.style.display = 'block';
setTimeout(() => {
  typingRow.style.display = 'none';
  const welcome = "السلام عليكم ورحمة الله وبركاته، وأهلاً وسهلاً بك في مجمع OCR السكني التابع لمجموعة الجدار. يسعدنا تواصلك معنا، هل تسمح لي أن أطلعك على أبرز ما يميز المجمع؟";
  addBubble(welcome, 'bot');
  history.push({ role: 'assistant', content: welcome });
}, 1800);
</script>
</body>
</html>
